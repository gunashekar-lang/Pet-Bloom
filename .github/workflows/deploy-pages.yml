name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        run: |
          touch .env
          flutter pub get
          flutter build web --release \
            --base-href "/Pet-Bloom/" \
            --dart-define=SUPABASE_URL=https://gsyzqytiitkmtjlcqdst.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gU5FrehFxdc2X9YH6rGIlw_tR39lEO6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
